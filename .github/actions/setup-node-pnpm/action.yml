name: Set up Node and pnpm, and install
description: >-
  Sets up pnpm from packageManager and Node from .node-version, with the pnpm store cached, then
  installs the lockfile's packages, with @serpcompany/verify from GitHub Packages.

inputs:
  token:
    description: The job's own token, which reads @serpcompany/verify from GitHub Packages
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: "@serpcompany"

    - name: Install, with @serpcompany/verify from GitHub Packages, read with this job's token
      id: install
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: pnpm install --frozen-lockfile

    - name: Say what installing the private package needs
      if: failure() && steps.install.outcome == 'failure'
      shell: bash
      run: >-
        echo "::error title=@serpcompany/verify is a private GitHub Package::This job grants
        packages: read, so the package's settings must give serpcompany/pitonne.jp Read under
        Manage Actions access (docs/agents/ci.md, Installing the private package)."
