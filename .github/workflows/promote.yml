name: Promote to Production

on:
  workflow_dispatch:

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  promote:
    name: Fast-forward main to staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Check deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::Missing RELEASE_DEPLOY_KEY repository secret (a write deploy key, stored in the release environment; see docs/gitflow.md)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check staging can be promoted
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: verify test
        run: |
          git fetch --prune origin
          staging=$(git rev-parse origin/staging)
          if [ "$staging" = "$(git rev-parse origin/main)" ]; then
            echo "::notice::main is already at staging ($(git rev-parse --short origin/staging)); nothing to promote."
            echo "STAGING_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/staging; then
            echo "::error::main has commits staging doesn't have. Let Sync staging finish (or resolve its conflict), then run this again."
            exit 1
          fi
          for check in $CHECKS; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$staging/check-runs?check_name=$check" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            if [ "${passed:-0}" -eq 0 ]; then
              echo "::error::staging ($staging) hasn't passed CI's $check job; wait for it or fix it first."
              exit 1
            fi
          done
          echo "STAGING_SHA=$staging" >> "$GITHUB_ENV"
          {
            echo "### Promoting to Production"
            echo
            echo '```'
            git log --oneline --no-decorate origin/main..origin/staging
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward main
        if: env.STAGING_SHA != ''
        run: git push origin "$STAGING_SHA:refs/heads/main"
