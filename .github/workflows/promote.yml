name: Promote to Production

# Promotes Staging to Production by fast-forwarding `main` to `staging` (`git push origin origin/staging:main`), so
# `main` receives exactly the commits already tested and deployed on Staging. Never a squash.
# Run it from Actions > Promote to Production > Run workflow. The push to `main` runs CI there, which deploys
# Production after its test job passes.
#
# It refuses when `main` has commits `staging` lacks (Sync staging hasn't caught up, or failed on a conflict), or when
# the `staging` commit hasn't passed CI's test job. It pushes with the RELEASE_DEPLOY_KEY deploy key, a bypass actor on
# the `main` ruleset, so the ruleset doesn't check this push at all (a bypass skips every rule, including the required
# test check): the checks above are what protect `main`. A push with GITHUB_TOKEN would not start CI on `main`.
on:
  workflow_dispatch:

concurrency:
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  promote:
    name: Fast-forward main to staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RELEASE_DEPLOY_KEY is a secret of the `release` environment, which only main and staging runs can use
    environment: release
    steps:
      - name: Check deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::Missing RELEASE_DEPLOY_KEY repository secret (a write deploy key, stored in the release environment; see docs/gitflow.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Check staging can be promoted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --prune origin
          staging=$(git rev-parse origin/staging)
          if [ "$staging" = "$(git rev-parse origin/main)" ]; then
            echo "::notice::main is already at staging ($(git rev-parse --short origin/staging)); nothing to promote."
            echo "STAGING_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/staging; then
            echo "::error::main has commits staging doesn't have. Let Sync staging finish (or resolve its conflict), then run this again."
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$staging/check-runs?check_name=test" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::staging ($staging) hasn't passed CI's test job; wait for it or fix it first."
            exit 1
          fi
          echo "STAGING_SHA=$staging" >> "$GITHUB_ENV"
          {
            echo "### Promoting to Production"
            echo
            echo '```'
            git log --oneline --no-decorate origin/main..origin/staging
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Not forced, so git only ever fast-forwards main (the bypass would let a forced push through); the sha is the one
      # checked above, and a CMS save landing in between makes the push fail safely
      - name: Fast-forward main
        if: env.STAGING_SHA != ''
        run: git push origin "$STAGING_SHA:refs/heads/main"
