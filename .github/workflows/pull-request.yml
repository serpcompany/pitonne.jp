name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The title is a Conventional Commit
        run: node tools/checks/pull-request.mjs title

  issue-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The pull request closes an issue, or says why it has none
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/checks/pull-request.mjs issue-link

  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: |
            tools/checks/pull-request.mjs
            verify.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: A fix changes a test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/checks/pull-request.mjs fix-test

  text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: tools/checks/pull-request.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The title and body name no path on someone's machine
        run: node tools/checks/pull-request.mjs text
