name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      HAS_APP_KEY: ${{ secrets.SERP_AGENT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - name: Install, with @serpcompany/verify from GitHub Packages, read with this job's token
        id: install
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      - name: Say what installing the private package needs
        if: failure() && steps.install.outcome == 'failure'
        run: >-
          echo "::error title=@serpcompany/verify is a private GitHub Package::This job grants
          packages: read, so the package's settings must give serpcompany/pitonne.jp Read under
          Manage Actions access (docs/agents/ci.md, Installing the private package)."
      - name: A short-lived token that reads the organization's private repositories
        id: app-token
        if: env.HAS_APP_KEY == 'true' && vars.SERP_AGENT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.SERP_AGENT_APP_ID }}
          private-key: ${{ secrets.SERP_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Every shared check, at the version the lockfile pins
        env:
          SERP_VERIFY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SERP_VERIFY_BASE: HEAD^1
        run: pnpm verify

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@serpcompany"
      - name: Install, with @serpcompany/verify from GitHub Packages, read with this job's token
        id: install
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      - name: Say what installing the private package needs
        if: failure() && steps.install.outcome == 'failure'
        run: >-
          echo "::error title=@serpcompany/verify is a private GitHub Package::This job grants
          packages: read, so the package's settings must give serpcompany/pitonne.jp Read under
          Manage Actions access (docs/agents/ci.md, Installing the private package)."
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:meta
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .next/cache
          key: next-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: next-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: DEPLOY_ENV=production pnpm build
      - run: pnpm audit:out
      - run: pnpm audit:seo
      - run: pnpm test:lighthouse

  changes:
    name: Classify changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
      fast: ${{ steps.fast.outputs.fast }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - id: classify
        env:
          DIFF_BASE: ${{ github.event.before }}
        run: node scripts/draft-only-change.mjs "$DIFF_BASE" "$GITHUB_SHA"
      - id: fast
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ONLY: ${{ steps.classify.outputs.content_only }}
          CHECKS: verify test
        run: |
          fast=false
          if [ "$CONTENT_ONLY" = true ]; then
            fast=true
            echo "Only CMS content changed; deploying without waiting for the checks."
          else
            missing=""
            for check in $CHECKS; do
              passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length') || passed=0
              [ "${passed:-0}" -gt 0 ] || missing="$missing $check"
            done
            if [ -z "$missing" ]; then fast=true; echo "This commit already passed $CHECKS; deploying now."; fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"

  deploy-content:
    name: Deploy content
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast == 'true'
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy
    needs: [changes, verify, test]
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast != 'true'
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  alert:
    name: Alert on red main
    needs: [verify, test, changes, deploy-content, deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'main' &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: alert-red-main
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "CI is failing on main"
      VERIFY_RESULT: ${{ needs.verify.result }}
      TEST_RESULT: ${{ needs.test.result }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DEPLOY_RESULTS: ${{ needs.deploy-content.result }} ${{ needs.deploy.result }}
    steps:
      - name: Open or update the red-main issue
        run: |
          failed=()
          [ "$VERIFY_RESULT" = failure ] && failed+=("\`verify\`")
          [ "$TEST_RESULT" = failure ] && failed+=("\`test\`")
          [ "$CHANGES_RESULT" = failure ] && failed+=("the change classification (nothing was deployed)")
          [[ " $DEPLOY_RESULTS " == *" failure "* ]] && failed+=("the Production deploy")
          FAILED=$(printf '%s and ' "${failed[@]}"); FAILED=${FAILED% and }
          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]') || subject=""
          body="@devinschumacher Failed on \`main\` at $GITHUB_SHA ($subject): $FAILED.
          Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          Every Production deploy uploads the newest commit on main, so the next successful deploy publishes everything. CMS content saves deploy as soon as they build. Fix the failed step, then close this issue."
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  preview:
    name: Deploy PR preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["staging", "main"]'), github.event.pull_request.base.ref) &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
