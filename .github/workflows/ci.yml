name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:meta
      - run: DEPLOY_ENV=production pnpm build
      - run: pnpm audit:out
      - run: pnpm audit:seo
      - run: pnpm test:lighthouse

  changes:
    name: Classify changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
      fast: ${{ steps.fast.outputs.fast }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        run: node scripts/draft-only-change.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - id: fast
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ONLY: ${{ steps.classify.outputs.content_only }}
        run: |
          fast=false
          if [ "$CONTENT_ONLY" = true ]; then
            fast=true
            echo "Only CMS content changed; deploying without waiting for test."
          else
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=test" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length') || passed=0
            if [ "${passed:-0}" -gt 0 ]; then fast=true; echo "This commit already passed test; deploying now."; fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"

  deploy-content:
    name: Deploy content
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast == 'true'
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy
    needs: [changes, test]
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast != 'true'
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  alert:
    name: Alert on red main
    needs: [test, changes, deploy-content, deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'main' &&
      (needs.test.result == 'failure' || needs.changes.result == 'failure' ||
      needs.deploy-content.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: alert-red-main
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "CI is failing on main"
      TEST_RESULT: ${{ needs.test.result }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DEPLOY_RESULTS: ${{ needs.deploy-content.result }} ${{ needs.deploy.result }}
    steps:
      - name: Open or update the red-main issue
        run: |
          failed=()
          [ "$TEST_RESULT" = failure ] && failed+=("\`test\`")
          [ "$CHANGES_RESULT" = failure ] && failed+=("the change classification (nothing was deployed)")
          [[ " $DEPLOY_RESULTS " == *" failure "* ]] && failed+=("the Production deploy")
          FAILED=$(printf '%s and ' "${failed[@]}"); FAILED=${FAILED% and }
          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]') || subject=""
          body="@devinschumacher Failed on \`main\` at $GITHUB_SHA ($subject): $FAILED.
          Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          Every Production deploy uploads the newest commit on main, so the next successful deploy publishes everything. CMS content saves deploy as soon as they build. Fix the failed step, then close this issue."
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  preview:
    name: Deploy PR preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["staging", "main"]'), github.event.pull_request.base.ref) &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
