name: CI

# Tests every PR and every push to staging and main, and deploys (via .github/workflows/deploy.yml):
# - a push to `staging` to Staging (https://staging.pitonne.jp), a push to `main` to Production (https://pitonne.jp);
# - same-repository PRs into `staging` or `main` to a `pr-<n>` preview, after the test job passes.
# Code changes deploy only after the test job passes. CMS content saves deploy as soon as they build (see `changes`),
# and a failing test on main opens an alert issue instead of blocking them (see `alert`).
on:
  pull_request:
  push:
    branches:
      - staging
      - main

# A new push to a PR cancels that PR's older run; every push to staging and main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:routes
      - run: pnpm audit:content
      - run: pnpm audit:strings
      - run: pnpm audit:meta
      - run: DEPLOY_ENV=production pnpm build
      - run: pnpm audit:out
      - run: pnpm audit:seo
      - run: pnpm test:lighthouse

  # Classifies the push. A separate job, so a skipped deploy never joins the deploy concurrency group.
  # - skip: only draft blog posts changed (a draft saved from the CMS), so the built site is unchanged.
  # - fast: deploy without waiting for this run's `test`, because either
  #   - only CMS content changed: content saves go live as soon as they build, whatever `test` says (a failing `test`
  #     alerts instead; see `alert`). Code reaches main only through tested PRs and promotions; or
  #   - this exact commit already passed `test`, e.g. a promotion of a commit tested on staging.
  changes:
    name: Classify changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
      fast: ${{ steps.fast.outputs.fast }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        run: node scripts/draft-only-change.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - id: fast
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ONLY: ${{ steps.classify.outputs.content_only }}
        run: |
          fast=false
          if [ "$CONTENT_ONLY" = true ]; then
            fast=true
            echo "Only CMS content changed; deploying without waiting for test."
          else
            # An API error falls back to waiting for test; it never skips the deploy
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=test" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length') || passed=0
            if [ "${passed:-0}" -gt 0 ]; then fast=true; echo "This commit already passed test; deploying now."; fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"

  # CMS content and already-tested commits: deploy now, so publishing stays quick
  deploy-content:
    name: Deploy content
    needs: changes
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast == 'true'
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Code changes: deploy only after the test job passes
  deploy:
    name: Deploy
    needs: [changes, test]
    if: needs.changes.outputs.skip != 'true' && needs.changes.outputs.fast != 'true'
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # A failing test on main never blocks publishing, so it has to reach a person: the run is red, and one open issue
  # collects every failure (with a mention of the owner) until someone fixes main and closes it.
  # Alerts when main's test fails or a Production deploy fails (CMS commits come from a bot, so nobody gets the
  # failure email). One alert job at a time, so two red runs can't open duplicate issues.
  alert:
    name: Alert on red main
    needs: [test, deploy-content, deploy]
    if: >-
      always() && github.event_name == 'push' && github.ref_name == 'main' &&
      (needs.test.result == 'failure' || needs.deploy-content.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: alert-red-main
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "CI is failing on main"
      FAILED: >-
        ${{ needs.test.result == 'failure' && '`test`' || '' }}
        ${{ (needs.deploy-content.result == 'failure' || needs.deploy.result == 'failure') && 'the Production deploy' || '' }}
    steps:
      - name: Open or update the red-main issue
        run: |
          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]') || subject=""
          body="@devinschumacher Failed on \`main\` at $GITHUB_SHA ($subject): $FAILED.
          Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          Every Production deploy uploads the newest commit on main, so the next successful deploy publishes everything. CMS content saves deploy as soon as they build. Fix the failed step, then close this issue."
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  # Forked PRs get no secrets and no preview. Previews are non-indexable and never use the main or staging aliases.
  preview:
    name: Deploy PR preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["staging", "main"]'), github.event.pull_request.base.ref) &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      pr: ${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
