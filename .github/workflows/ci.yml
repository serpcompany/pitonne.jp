name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:routes
      - run: pnpm audit:content
      - run: pnpm audit:strings
      - run: DEPLOY_ENV=production pnpm build
      - run: test -f apps/web/out/index.html && test -f apps/web/out/ja/index.html && test -f apps/web/out/robots.txt && test -f apps/web/out/sitemap.xml && test -f apps/web/out/videos-sitemap.xml && test -f apps/web/out/_headers && test -f apps/web/out/_redirects && test ! -d apps/web/out/en
      - run: pnpm test:lighthouse
