name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

jobs:
  # Draft saves from the CMS don't change the built site. This check is a separate job so a skipped run never joins
  # the deploy concurrency group, where it would cancel a real deploy still in progress.
  changes:
    name: Check for draft-only changes
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.drafts.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: drafts
        if: github.event_name == 'push'
        run: node scripts/draft-only-change.mjs "${{ github.event.before }}" "${{ github.sha }}"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    concurrency:
      group: cloudflare-pages-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
      CLOUDFLARE_PROJECT_NAME: pitonne-jp
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Cloudflare deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Configure deployment environment
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_DEPLOY_ENV=production" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=preview" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_DEPLOY_ENV=preview" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: pnpm build

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/ja/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/sitemap-index.xml
          test -f out/_headers
          test -f out/_redirects
          test ! -d out/en

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.103.0"
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
