name: Deploy

# Builds the static export and uploads it to Cloudflare Pages, then smoke-tests the environment.
# - CI (.github/workflows/ci.yml) calls it after each push to `staging` (Staging) or `main` (Production), and for PR
#   previews (`pr-<n>`).
# - A manual run (Actions > Deploy > Run workflow) redeploys the branch it's run from: `main` to Production, `staging`
#   to Staging. It skips CI's test gate, so use it only to redeploy a commit CI already passed.
# Staging and Production deploys always upload the branch tip, so an older commit never replaces a newer one (scripts/deploy-target.mjs).
on:
  workflow_call:
    inputs:
      environment:
        description: production, staging or preview
        type: string
        required: true
      pr:
        description: Pull request number (preview only)
        type: number
        required: false
      ref:
        description: Commit to deploy (defaults to the triggering commit)
        type: string
        required: false
    # Only the Cloudflare token; the release deploy key never reaches deploys or PR previews
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy per target and environment at a time; a newer queued deploy replaces an older queued one, and a running
    # deploy is never cancelled. Staging, Production and each PR preview are separate groups.
    concurrency:
      group: deploy-pages-${{ inputs.environment == 'preview' && format('pr-{0}', inputs.pr) || inputs.environment || (github.ref_name == 'main' && 'production') || github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
      CLOUDFLARE_PROJECT_NAME: pitonne-jp
      WRANGLER_SEND_METRICS: "false"
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || '' }}
      PR_NUMBER: ${{ inputs.pr }}
      DEPLOY_SHA: ${{ inputs.ref || github.sha }}
    steps:
      # Production deploys only from main and Staging only from staging; previews only to their own pr-<n> alias.
      # So no PR or other branch can ever reach the `main` or `staging` aliases (pitonne.jp, staging.pitonne.jp).
      - name: Resolve environment
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$TARGET" in
            production) [ "$GITHUB_REF" = refs/heads/main ] || fail "Production deploys only from main (got $GITHUB_REF)."; branch=main ;;
            staging) [ "$GITHUB_REF" = refs/heads/staging ] || fail "Staging deploys only from staging (got $GITHUB_REF)."; branch=staging ;;
            preview)
              [ "$GITHUB_EVENT_NAME" = pull_request ] || fail "Previews deploy only for pull requests."
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "A preview needs a pull request number."
              branch="pr-$PR_NUMBER" ;;
            *) fail "Run this workflow from main (Production) or staging (Staging)." ;;
          esac
          {
            echo "DEPLOY_ENV=$TARGET"
            echo "NEXT_PUBLIC_DEPLOY_ENV=$TARGET"
            echo "PAGES_BRANCH=$branch"
          } >> "$GITHUB_ENV"
          echo "Deploying $DEPLOY_SHA to $TARGET (Pages branch $branch)."

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      # Inside the concurrency group, so no other deploy of this environment runs between this check and the upload.
      # Always uploads the branch tip, so a queued older deploy still publishes every newer CMS save. If this step
      # fails, the deploy goes ahead with the triggering commit: publishing beats a missed optimisation.
      - name: Choose the commit to deploy
        id: target
        if: env.DEPLOY_ENV != 'preview'
        continue-on-error: true
        run: |
          git fetch --quiet origin "$PAGES_BRANCH" || echo "::warning::Couldn't fetch origin/$PAGES_BRANCH."
          node scripts/deploy-target.mjs "$PAGES_BRANCH" "$DEPLOY_SHA"

      - name: Check out the chosen commit
        if: steps.target.outputs.skip == 'false' && steps.target.outputs.sha != env.DEPLOY_SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git checkout --quiet --detach "$TARGET_SHA"
          echo "DEPLOY_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.target.outputs.skip != 'true'
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        if: steps.target.outputs.skip != 'true'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.target.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare deploy token
        if: steps.target.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Build static export
        if: steps.target.outputs.skip != 'true'
        run: pnpm build

      # Production must be indexable; every other environment must not be
      - name: Verify static output
        if: steps.target.outputs.skip != 'true'
        run: |
          pnpm audit:out
          if [ "$DEPLOY_ENV" = production ]; then
            if grep -Fxq "Disallow: /" out/robots.txt; then echo "::error::Production robots.txt disallows crawling."; exit 1; fi
            if grep -Fq "X-Robots-Tag: noindex" out/_headers; then echo "::error::Production _headers sends noindex."; exit 1; fi
          else
            grep -Fxq "Disallow: /" out/robots.txt
            grep -Fq "X-Robots-Tag: noindex" out/_headers
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.target.outputs.skip != 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.103.0"
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ env.DEPLOY_SHA }}
          # GitHub deployment records for Staging and Production; the Cloudflare Pages app comments on PR previews
          gitHubToken: ${{ env.DEPLOY_ENV != 'preview' && github.token || '' }}

      - name: Smoke-test canonical host redirects
        if: steps.target.outputs.skip != 'true' && env.DEPLOY_ENV == 'production'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/smoke-canonical-host.mjs "$DEPLOYMENT_URL"

      # Production allows crawling and lists its sitemap; Staging and previews send noindex and disallow crawling.
      # Production is checked on the pages.dev production alias (with the smoke-test header) and pitonne.jp, never on
      # the hash deployment URL: Cloudflare adds X-Robots-Tag: noindex to every hash URL, Production's included.
      - name: Smoke-test environment behaviour
        if: steps.target.outputs.skip != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          case "$DEPLOY_ENV" in
            production) node scripts/smoke-environment.mjs production https://pitonne-jp.pages.dev https://pitonne.jp ;;
            staging) node scripts/smoke-environment.mjs staging "${ALIAS_URL:-https://staging.pitonne-jp.pages.dev}" "$DEPLOYMENT_URL" https://staging.pitonne.jp ;;
            preview) node scripts/smoke-environment.mjs preview "${ALIAS_URL:-https://$PAGES_BRANCH.pitonne-jp.pages.dev}" "$DEPLOYMENT_URL" ;;
          esac
          echo "Deployed $DEPLOY_SHA to $DEPLOY_ENV: ${ALIAS_URL:-$DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
