name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: production, staging or preview
        type: string
        required: true
      pr:
        description: Pull request number (preview only)
        type: number
        required: false
      ref:
        description: Commit to deploy (defaults to the triggering commit)
        type: string
        required: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: write
      packages: read
    concurrency:
      group: deploy-pages-${{ inputs.environment == 'preview' && format('pr-{0}', inputs.pr) || inputs.environment || (github.ref_name == 'main' && 'production') || github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
      CLOUDFLARE_PROJECT_NAME: pitonne-jp
      WRANGLER_SEND_METRICS: "false"
      TARGET: ${{ inputs.environment || (github.ref_name == 'main' && 'production') || (github.ref_name == 'staging' && 'staging') || '' }}
      PR_NUMBER: ${{ inputs.pr }}
      DEPLOY_SHA: ${{ inputs.ref || github.sha }}
    steps:
      - name: Resolve environment
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$TARGET" in
            production) [ "$GITHUB_REF" = refs/heads/main ] || fail "Production deploys only from main (got $GITHUB_REF)."; branch=main ;;
            staging) [ "$GITHUB_REF" = refs/heads/staging ] || fail "Staging deploys only from staging (got $GITHUB_REF)."; branch=staging ;;
            preview)
              [ "$GITHUB_EVENT_NAME" = pull_request ] || fail "Previews deploy only for pull requests."
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail "A preview needs a pull request number."
              branch="pr-$PR_NUMBER" ;;
            *) fail "Run this workflow from main (Production) or staging (Staging)." ;;
          esac
          {
            echo "DEPLOY_ENV=$TARGET"
            echo "NEXT_PUBLIC_DEPLOY_ENV=$TARGET"
            echo "PAGES_BRANCH=$branch"
          } >> "$GITHUB_ENV"
          echo "Deploying $DEPLOY_SHA to $TARGET (Pages branch $branch)."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Choose the commit to deploy
        id: target
        if: env.DEPLOY_ENV != 'preview'
        run: node scripts/deploy-target.mjs "$PAGES_BRANCH" "$DEPLOY_SHA"

      - name: Check out the chosen commit
        if: env.DEPLOY_ENV != 'preview' && steps.target.outputs.sha != env.DEPLOY_SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git checkout --quiet --detach "$TARGET_SHA"
          echo "DEPLOY_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Set up Node and pnpm, and install
        uses: ./.github/actions/setup-node-pnpm
        with:
          token: ${{ github.token }}

      - name: Check Cloudflare deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .next/cache
          key: next-${{ env.DEPLOY_ENV }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: next-${{ env.DEPLOY_ENV }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build static export
        run: pnpm build

      - name: Verify static output
        run: pnpm audit:out

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.103.0"
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ env.PAGES_BRANCH }} --commit-hash=${{ env.DEPLOY_SHA }}
          gitHubToken: ${{ env.DEPLOY_ENV != 'preview' && github.token || '' }}

      - name: Smoke-test canonical host redirects
        if: env.DEPLOY_ENV == 'production'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/smoke-canonical-host.mjs "$DEPLOYMENT_URL"

      - name: Smoke-test environment behaviour
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          case "$DEPLOY_ENV" in
            production) node scripts/smoke-environment.mjs production https://pitonne-jp.pages.dev https://pitonne.jp ;;
            staging) node scripts/smoke-environment.mjs staging "${ALIAS_URL:-https://staging.pitonne-jp.pages.dev}" "$DEPLOYMENT_URL" https://staging.pitonne.jp ;;
            preview) node scripts/smoke-environment.mjs preview "${ALIAS_URL:-https://$PAGES_BRANCH.pitonne-jp.pages.dev}" "$DEPLOYMENT_URL" ;;
          esac
          echo "Deployed $DEPLOY_SHA to $DEPLOY_ENV: ${ALIAS_URL:-$DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
