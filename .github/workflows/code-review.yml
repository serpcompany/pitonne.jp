name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["claude[bot]","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
      issues: read
      packages: read
      pull-requests: write
    env:
      HAS_REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SUMMARY_FILE: tmp/review-summary.md
      REVIEW_BOT: github-actions[bot]
      SUMMARY_BOT: github-actions[bot]
    steps:
      - name: Skip while the CLAUDE_CODE_OAUTH_TOKEN secret isn't set
        if: env.HAS_REVIEW_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so Claude doesn't review this pull request (docs/agents/ci-pull-requests.md, Code review)."

      - name: Wait for the fast checks on the head commit
        id: fast
        if: env.HAS_REVIEW_TOKEN == 'true'
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: verify test
        run: |
          for attempt in $(seq 1 80); do
            pending="" failed=""
            for check in $CHECKS; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=$check&filter=latest" \
                --jq '.check_runs | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end') || state=unknown
              case "$state" in
                success) ;;
                missing|running|unknown) pending="$pending $check" ;;
                *) failed="$failed $check ($state)" ;;
              esac
            done
            if [ -n "$failed" ]; then
              echo "::notice title=No review until the fast checks pass::$failed didn't pass on $HEAD_SHA. The next push that passes them is reviewed."
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$pending" ]; then
              echo "$CHECKS passed on $HEAD_SHA."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for$pending on $HEAD_SHA (look $attempt of 80)."
            sleep 15
          done
          echo "::error::$CHECKS didn't finish on $HEAD_SHA within 20 minutes."
          exit 1

      - name: Check out the whole repository, with its history, at the pull request's head
        if: steps.fast.outputs.passed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: steps.fast.outputs.passed == 'true'
        with:
          node-version-file: .node-version

      - name: Take the review's scripts from the @serpcompany/verify the default branch's lockfile pins
        id: scripts
        if: steps.fast.outputs.passed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          resolution=$(git show "origin/$DEFAULT_BRANCH:pnpm-lock.yaml" | grep -A1 -E "^  '@serpcompany/verify@[0-9.]+':$" | sed -n 2p)
          integrity=$(printf '%s' "$resolution" | sed -nE 's/.*integrity: (sha512-[A-Za-z0-9+/=]+).*/\1/p')
          tarball=$(printf '%s' "$resolution" | sed -nE 's#.*tarball: (https://npm\.pkg\.github\.com/download/@serpcompany/verify/[^ }]+).*#\1#p')
          if [ -z "$integrity" ] || [ -z "$tarball" ]; then
            echo "::error::origin/$DEFAULT_BRANCH's pnpm-lock.yaml names no @serpcompany/verify tarball and integrity."
            exit 1
          fi
          { echo "tarball=$tarball"; echo "integrity=$integrity"; } >> "$GITHUB_OUTPUT"
          curl -fsSL --retry 3 --max-time 120 -H "Authorization: Bearer $GITHUB_TOKEN" -o "$RUNNER_TEMP/verify.tgz" "$tarball"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/verify.tgz" | base64 -w0)"
          if [ "$got" != "$integrity" ]; then
            echo "::error::$tarball isn't the package the lockfile pins ($got, not $integrity)."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/serp-verify"
          mkdir "$RUNNER_TEMP/serp-verify"
          tar -xzf "$RUNNER_TEMP/verify.tgz" -C "$RUNNER_TEMP/serp-verify"
          echo "Took the review's scripts from $tarball."

      - name: Give the reviewer the rules, the change since the last review, its issue, and the earlier findings
        id: context
        if: steps.fast.outputs.passed == 'true'
        env:
          RULES: AGENTS.md ARCHITECTURE.md CONTEXT.md docs/agents/code.md
          CHANGE_DIR: ${{ github.workspace }}/tmp/review-change
          CONTEXT_FILE: ${{ runner.temp }}/review-context.md
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/serp-verify/package/dist/review/main.js" context

      - name: Choose the reviewer for the change
        id: role
        if: steps.fast.outputs.passed == 'true'
        env:
          SINCE: ${{ steps.context.outputs.since }}
        run: |
          code=$(git diff --numstat "origin/$BASE_REF...$HEAD_SHA" -- . \
            ':(exclude)*.md' ':(exclude)content/**' ':(exclude)public/**' ':(exclude)pnpm-lock.yaml' \
            ':(exclude)src/lib/i18n/dictionaries/**' ':(exclude)**/*.test.*' ':(exclude)e2e/**' \
            | awk '{ lines += $1 + $2 } END { print lines + 0 }')
          risky=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" -- .github functions wrangler.toml \
            src/lib/canonical-host.ts public/_headers public/_redirects public/_routes.json | wc -l)
          if [ -n "$SINCE" ]; then role=re-reviewer model=claude-sonnet-5-5 effort=medium why="a re-review of the commits since $SINCE"
          elif [ "$risky" -gt 0 ]; then role=reviewer model=claude-opus-5-5 effort=xhigh why="a first review of a change to CI, the hosts or the Staging gate"
          elif [ "$code" -lt 50 ]; then role=re-reviewer model=claude-sonnet-5-5 effort=medium why="the only review of a small change ($code changed lines of code)"
          else role=reviewer model=claude-opus-5-5 effort=high why="a first review ($code changed lines of code)"
          fi
          echo "The $role reviews: $why."
          { echo "model=$model"; echo "effort=$effort"; } >> "$GITHUB_OUTPUT"

      - name: Review with Claude
        id: review
        if: steps.fast.outputs.passed == 'true'
        timeout-minutes: 20
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "claude[bot],serp-agent[bot],Copilot"
          classify_inline_comments: "false"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} as a fresh reviewer. The checkout is the whole repository at its head commit, ${{ github.event.pull_request.head.sha }}. Read only: don't edit, commit, push, approve or merge.

            Your instructions also hold this repository's rules as they are on the base branch, the change (one patch per changed file, with an index), the issue it closes, and the findings posted on earlier commits. Review against those copies of the rules. You can't run git, and .git is closed to you: the patches show the change, and gh pr view, gh pr diff and gh issue view show the pull request, its commits and its issue.

            1. Read the index, then every patch it lists, with Read, a long patch in parts. Read what each change depends on, such as callers, types, tests and the doc AGENTS.md routes the area to, with Read, Grep and Glob.
            2. Start three reviewers with the Agent tool in one message, and tell each to read the whole change itself:
               - bugs: logic errors, missed edge cases, security holes, data loss and error handling that hides failures, each with a concrete failure; and claims that hold by name but not by use: for everything the change moves, renames, removes, restricts or relies on, search for where it is used;
               - rules: each rule in AGENTS.md and the docs it routes to that the change breaks, quoted;
               - the issue, tests and docs: an acceptance criterion the change doesn't meet, changed behavior with no test, and a doc the change makes wrong.
               Skip what pnpm check and CI enforce: comments, file sizes, doc links, formatting, lint, types and the tests. Run no build, suite or preview.
            3. Check each finding against the code at the head commit. Keep only real findings that are new to this pull request and that a careful senior reviewer would ask to fix; drop any that repeats an earlier finding.
            4. Post each finding as one comment on the line it concerns, with mcp__github_inline_comment__create_inline_comment, starting **blocking** (a bug, a regression, a broken rule, an unmet acceptance criterion, or changed behavior with no test) or **suggestion**, then what is wrong, why, and the fix. A finding about a line the change doesn't touch goes on the nearest changed line and names the real file and line. Link a rule by its full URL on the base branch.
            5. Write the summary to the file your instructions name, and post nothing else: the heading they name, "Read <N> of <M> changed files." with a "Not read:" line when N is less than M, then "<B> blocking and <S> suggestion(s), commented on their lines." or "No new findings.", whether each acceptance criterion of the issue is met, and for each earlier finding whether this commit fixes it.
          claude_args: >-
            --model ${{ steps.role.outputs.model }}
            --effort ${{ steps.role.outputs.effort }}
            --setting-sources user
            --strict-mcp-config
            --append-system-prompt-file ${{ runner.temp }}/review-context.md
            --append-subagent-system-prompt-file ${{ runner.temp }}/review-context.md
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Write,Agent,Task,Read,Glob,Grep"
            --disallowedTools "Read(./.git/**),Edit(./.git/**),Read(//proc/**)"

      - name: Take the scripts again, so nothing the reviewer wrote runs with the token
        if: ${{ !cancelled() && steps.fast.outputs.passed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.scripts.outputs.tarball }}
          INTEGRITY: ${{ steps.scripts.outputs.integrity }}
        run: |
          rm -rf "$RUNNER_TEMP/serp-verify"
          archive=$(mktemp "$RUNNER_TEMP/verify-XXXXXX")
          curl -fsSL --retry 3 --max-time 120 -H "Authorization: Bearer $GITHUB_TOKEN" -o "$archive" "$TARBALL"
          got="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          if [ "$got" != "$INTEGRITY" ]; then
            echo "::error::$TARBALL isn't the package the lockfile pins ($got, not $INTEGRITY)."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/serp-verify"
          tar -xzf "$archive" -C "$RUNNER_TEMP/serp-verify"

      - name: Post the summary, with the commit it reviewed
        id: summary
        if: steps.fast.outputs.passed == 'true' && steps.review.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUMMARY_ID: ${{ steps.context.outputs.summary_id }}
        run: node "$RUNNER_TEMP/serp-verify/package/dist/review/main.js" summary

      - name: Keep the review transcript
        if: always() && steps.fast.outputs.passed == 'true' && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: claude-review-transcript
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 7
          overwrite: true

      - name: Fail unless a review ran and was posted
        if: ${{ !cancelled() && steps.fast.outputs.passed == 'true' }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          POSTED: ${{ steps.summary.outputs.posted }}
        run: node "$RUNNER_TEMP/serp-verify/package/dist/review/main.js" verdict
